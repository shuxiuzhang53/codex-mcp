# Alternative to codex-config-snippet.toml after running:
#   /ABSOLUTE/PATH/TO/codex-mcp/install-literature-mcp-tools.sh
#
# This avoids downloading packages on every MCP server startup.

[mcp_servers.paper_search]
command = "uv"
args = ["tool", "run", "paper-search-mcp"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.paper_search.env]
PAPER_SEARCH_MCP_UNPAYWALL_EMAIL = "your-email@example.com"
PAPER_SEARCH_MCP_CORE_API_KEY = ""
PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY = ""
PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN = ""
PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL = ""

[mcp_servers.zotero]
command = "zotero-mcp"
args = ["serve"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.zotero.env]
ZOTERO_API_KEY = "paste-your-zotero-api-key-here"
ZOTERO_LIBRARY_ID = "paste-your-zotero-user-id-here"
ZOTERO_LIBRARY_TYPE = "user"
UNPAYWALL_EMAIL = "your-email@example.com"
NO_PROXY = "localhost,127.0.0.1"
